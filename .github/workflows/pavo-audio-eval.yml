name: HeroVerse Pavo audio evaluation (stored Pavo clips with OUR Kokoro audio over their picture; SyncNet against our audio; nothing generated)
run-name: "pavo-audio-eval ${{ github.run_id }}"
# E286 (owner 2026-11-03: "o pavo nao tem vida propria... quem ta errado e voce"): clips were rejected for the WORDS
# of Pavo's re-synthesized track (SPEECH_WORDS_NOT_EXACT, AUDIO_NOT_OUR_LINE) while their picture was good. This lays
# the exact Kokoro line we sent (regenerated from the plan version of the probe, same pins as shot-probe.yml) over each
# stored clip's picture and measures the mouth against OUR audio with lipsync_check (SyncNet offset and confidence,
# face). No Pavo call, no secret, no generation, nothing approved. The numbers are the artifact.
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/pavo-audio-eval.yml
      - migration/production/bible/pavo_audio_eval.py
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: heroverse-pavo-audio-eval-${{ github.ref }}
  cancel-in-progress: false
jobs:
  eval:
    if: github.repository == 'matheusmagah-cpu/heroverse-engine'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Tools, pinned voice runtime, MediaPipe face model and SyncNet weights (the pins of shot-probe.yml)
        run: |
          APT_UPDATE_TIMEOUT=300s APT_INSTALL_TIMEOUT=600s bash migration/ci/apt_install.sh ffmpeg espeak-ng fonts-dejavu-core libegl1 libgles2
          python3 -m venv "$RUNNER_TEMP/voice"
          "$RUNNER_TEMP/voice/bin/pip" install --disable-pip-version-check -q 'kokoro-onnx==0.4.9' 'onnxruntime==1.20.1' 'numpy==2.2.6' 'espeakng-loader==0.2.4' 'soundfile==0.13.1'
          python3 -m venv "$RUNNER_TEMP/lip"
          "$RUNNER_TEMP/lip/bin/pip" install --disable-pip-version-check -q 'mediapipe==0.10.35'
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/face_landmarker.task" https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task
          sha=$(python3 -I -c "import re,sys;print(re.search(r'MODEL_SHA256 = \"([0-9a-f]{64})\"',open(sys.argv[1]).read()).group(1))" migration/production/bible/lipsync_check.py)
          echo "$sha  $RUNNER_TEMP/face_landmarker.task" | sha256sum -c -
          sha=$(python3 -I -c "import re,sys;print(re.search(r'SYNCNET_SHA256 = \"([0-9a-f]{64})\"',open(sys.argv[1]).read()).group(1))" migration/production/bible/syncnet.py)
          bash migration/ci/pinned_asset.sh fetch "syncnet_v2-$sha.model" "$sha" "$RUNNER_TEMP/syncnet_v2.model" https://www.robots.ox.ac.uk/~vgg/software/lipsync/data/syncnet_v2.model
          echo "$sha  $RUNNER_TEMP/syncnet_v2.model" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/out"
      - name: Each probe's line regenerated from the plan version it used, then each clip with our audio over it
        run: |
          set -eo pipefail
          export ESPEAK_DATA_PATH=$("$RUNNER_TEMP/voice/bin/python" -I -c "import espeakng_loader as e;print(e.get_data_path())")
          # episode | plan commit | probe run | shot:clip sha256 prefix ...
          while read -r ep ref run clips; do
            [ -n "$ep" ] || continue
            plan="migration/production/bible/plans/$ep.json"
            git show "$ref:$plan" > "$plan"
            want=$(python3 -I -c "import json,sys;print(json.load(open(sys.argv[1]))['plan_sha256'])" "migration/evidence/shots/$ep/$run.json")
            echo "$want  $plan" | sha256sum -c -   # the plan bytes the probe ran
            work="$GITHUB_WORKSPACE/.episode/eval-$ep-$run"
            rm -rf "$work"; mkdir -p "$work"
            python3 -I -B migration/production/bible/episode_build.py voice-script "$plan" "$work"
            python3 -I -B migration/production/pilot_render.py prepare "$work" HeroVerse_Linux_Source_Ready_20261013_v2.zip
            "$RUNNER_TEMP/voice/bin/python" -I -B migration/production/pilot_render.py voice "$work" "$work/voice-script.json"
            python3 -I -B migration/production/bible/episode_build.py lines "$plan" "$work"
            for it in $clips; do
              shot=${it%%:*}; pre=${it#*:}
              sha=$(python3 -I - "migration/evidence/shots/$ep/$run.json" "$shot" "$pre" <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1]))
          print([c["clip_sha256"] for c in d["shots"][sys.argv[2]]["clips"] if c["clip_sha256"].startswith(sys.argv[3])][0])
          PY
          )
              asset="shot-$ep-$shot-sha256-$sha.mp4"
              dl="$RUNNER_TEMP/dl/$ep-$run"; mkdir -p "$dl"
              bash migration/ci/assets.sh download --repo "$GITHUB_REPOSITORY" --pattern "$asset" -D "$dl" --clobber
              echo "$sha  $dl/$asset" | sha256sum -c -
              wav=$(python3 -I - "$work/layout.json" "$shot" <<'PY'
          import json, sys
          l = json.load(open(sys.argv[1]))
          r = l["keeper"].get(sys.argv[2]) or l["speakers"][sys.argv[2]]
          print(r["wav"])
          PY
          )
              printf 'EVAL %s %s %s line=%s\n' "$ep" "$run" "$shot" "$(sha256sum "$wav" | cut -c1-16)"
              "$RUNNER_TEMP/lip/bin/python" -I -B migration/production/bible/pavo_audio_eval.py "$dl/$asset" "$wav" "$RUNNER_TEMP/face_landmarker.task" "$RUNNER_TEMP/syncnet_v2.model" "$RUNNER_TEMP/mux" \
                | python3 -I -c "import json,sys;r=json.loads(sys.stdin.read());r['episode'],r['run'],r['shot']=sys.argv[1:4];print(json.dumps(r))" "$ep" "$run" "$shot" | tee -a "$RUNNER_TEMP/out/results.jsonl"
            done
          done <<'SETS'
          genesis-10-short 23c40bf9df 41574608645 k-insight:c8d168 k-insight:950e4d k-close:cdcae1 k-close:7ae781
          flood-ends-long 3a14d273fe 41547308176 k-hook:bd1e8c k-hook:9be7cd k-bow:89b603 k-bow:8023c5
          flood-ends-long 959a25617f 41534197400 k-bow:eaa3a3 k-bow:ad6fde
          flood-ends-long-reflection-1 eb8bb0e862 41562885923 k-r1:b2298c k-r1:843bca k-r2:f9f16c k-r2:3a1695
          flood-ends-long-reflection-1 f404524785 41572178956 k-r3:7f8932 k-r3:b132b7 k-r2:7f043f
          arc-02-noah-compilation-keeper dd1d4c9c19 41629339290 k-hook:9ba6e7 k-hook:5a28e1 k-close:1fcff3 k-close:15cf61
          SETS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pavo-audio-eval-${{ github.run_id }}
          path: ${{ runner.temp }}/out
          if-no-files-found: ignore
          retention-days: 30
